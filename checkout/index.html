<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Checkout | R.C.</title>
    <link rel="icon" type="image/png" href="/assets/images/logo.png?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root { --bg-base: #0a0a0a; --accent: #C81E31; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); --text-main: #C0C0C0; --text-light: #F5F5F5; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Rajdhani', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;}
        .checkout-container { width: 100%; max-width: 1100px; background: var(--glass-bg); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; }
        .top-section { display: grid; grid-template-columns: 1.2fr 1fr; border-bottom: 1px solid var(--glass-border); }
        .order-summary { padding: 40px; background: rgba(0,0,0,0.2); border-right: 1px solid var(--glass-border); }
        .client-form { padding: 40px; background: rgba(255,255,255,0.01); }
        .specs { color: var(--accent); font-size: 0.8rem; letter-spacing: 4px; text-transform: uppercase; font-weight: 700; margin-bottom: 10px; display: block; }
        h2, h3 { font-family: 'Oswald'; text-transform: uppercase; color: var(--text-light); }
        h2 { font-size: 2.2rem; margin-bottom: 30px; }
        h3 { font-size: 1.4rem; margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;}
        .input-group { margin-bottom: 15px; }
        label { color: #888; font-size: 0.85rem; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        input, textarea { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; font-family: 'Rajdhani'; font-size: 1rem; transition: 0.3s; }
        input:focus, textarea:focus { border-color: var(--accent); outline: none; background: #151515; }
        .tip-box { background: rgba(200, 30, 49, 0.05); padding: 15px; border-radius: 12px; border: 1px dashed var(--accent); margin-top: 10px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--glass-border); }
        .item-name { font-size: 1.2rem; color: var(--text-light); font-weight: 700; }
        .item-price { font-family: 'Oswald'; font-size: 1.4rem; color: var(--accent); }
        .total-display { margin-top: 40px; }
        .total-label { font-size: 1rem; letter-spacing: 2px; color: #888; }
        .total-price { font-family: 'Oswald'; font-size: 3.5rem; color: var(--text-light); line-height: 1; }
        .bottom-action { padding: 40px; background: rgba(0,0,0,0.4); }
        .terms-container { width: 100%; margin-bottom: 30px; }
        .terms-text { font-size: 0.9rem; color: #666; line-height: 1.6; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .terms-column h4 { color: #aaa; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
        .checkbox-container { display: flex; align-items: center; gap: 12px; margin: 30px 0; cursor: pointer; justify-content: center; }
        .checkbox-container input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent); }
        .btn { width: 100%; max-width: 500px; margin: 0 auto; display: block; padding: 20px; background: #222; color: #555; font-family: 'Oswald'; font-weight: 700; font-size: 1.4rem; letter-spacing: 3px; border-radius: 12px; border: 1px solid #333; transition: 0.4s; cursor: not-allowed; }
        .btn.active { background: var(--accent); color: white; border-color: var(--accent); cursor: pointer; box-shadow: 0 10px 30px rgba(200, 30, 49, 0.3); }
        .btn.active:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(200, 30, 49, 0.4); }
        @media (max-width: 850px) {
            .top-section { grid-template-columns: 1fr; }
            .order-summary { border-right: none; border-bottom: 1px solid var(--glass-border); }
            .terms-text { grid-template-columns: 1fr; gap: 15px; }
            .total-price { font-size: 2.8rem; }
        }
        /* --- ANTI-THEFT ARMOR --- */
        img, video, canvas {
            -webkit-user-drag: none; 
            -khtml-user-drag: none; 
            -moz-user-drag: none; 
            -o-user-drag: none; 
            user-select: none; 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none;
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div class="top-section">
            <div class="order-summary">
                <span class="specs">SECURE ARCHITECTURE</span>
                <h2>ORDER OVERVIEW</h2>
                
                <div class="item-row">
                    <div class="item-name" id="display-item">Loading...</div>
                    <div class="item-price" id="display-price">RM 0</div>
                </div>
                
                <div class="total-display">
                    <div class="total-label">FINAL INVESTMENT</div>
                    <div class="total-price" id="display-total">RM 0</div>
                </div>
            </div>

            <div class="client-form">
                <h3>CLIENT DETAILS</h3>
                <div class="input-group">
                    <label>Full Name *</label>
                    <input type="text" id="clientName" placeholder="Azhari Azmi">
                </div>
                <div class="input-group">
                    <label>Primary Email *</label>
                    <input type="email" id="primaryEmail" placeholder="mrazhariazmi@gmail.com">
                </div>
                <div class="input-group">
                    <label>Alternative Email (Optional)</label>
                    <input type="email" id="deliveryEmail" placeholder="For file delivery">
                </div>
                <div class="input-group">
                    <label>WhatsApp Number *</label>
                    <input type="tel" id="clientPhone" placeholder="+60...">
                </div>
                <div class="input-group">
                    <label>Shipping / Project Remarks</label>
                    <textarea id="clientRemarks" rows="2" placeholder="Address or notes..."></textarea>
                </div>
                
                <div class="tip-box">
                    <label style="color: var(--accent);">SUPPORT THE VISION (TIP JAR RM)</label>
                    <input type="number" id="clientTip" placeholder="0" min="0">
                </div>
            </div>
        </div>

        <div class="bottom-action">
            <div class="terms-container">
                <div class="terms-text">
                    <div class="terms-column">
                        <h4>1. COMMENCEMENT</h4>
                        <p>Full payment is required before production. Non-refundable once work begins.</p>
                    </div>
                    <div class="terms-column">
                        <h4>2. INTELLECTUAL PROPERTY</h4>
                        <p>Client gains commercial rights upon final payment. R.C. retains portfolio rights.</p>
                    </div>
                </div>
            </div>

            <label class="checkbox-container">
                <input type="checkbox" id="agree-checkbox">
                <span style="color: #fff; font-size: 0.9rem;">I AGREE TO THE TERMS OF SERVICE</span>
            </label>

            <button class="btn" id="pay-btn" disabled>PROCEED TO PAYMENT</button>
        </div>
    </div>

    <script>
        // 1. Get Data from URL & Force to Number
        const urlParams = new URLSearchParams(window.location.search);
        const itemName = urlParams.get('item') || 'Custom Project Retainer';
        // Force the price to be a Number so math works!
        let basePrice = parseFloat(urlParams.get('price')) || 0;

        // 2. Initial Display
        document.getElementById('display-item').innerText = itemName;
        document.getElementById('display-price').innerText = `RM ${basePrice}`;
        document.getElementById('display-total').innerText = `RM ${basePrice}`;

        // 3. Dynamic Tip Math (THE FIX)
        const tipInput = document.getElementById('clientTip');
        const totalDisplay = document.getElementById('display-total');

        tipInput.addEventListener('input', () => {
            let tipValue = parseFloat(tipInput.value) || 0;
            let finalSum = basePrice + tipValue;
            totalDisplay.innerText = `RM ${finalSum}`;
        });

        // 4. Checkbox & Button
        const checkbox = document.getElementById('agree-checkbox');
        const payBtn = document.getElementById('pay-btn');

        checkbox.addEventListener('change', function() {
            if (this.checked) {
                payBtn.classList.add('active');
                payBtn.disabled = false;
            } else {
                payBtn.classList.remove('active');
                payBtn.disabled = true;
            }
        });

        // 5. Submit to Cloudflare Worker
        payBtn.addEventListener('click', async function() {
            const name = document.getElementById('clientName').value;
            const email = document.getElementById('primaryEmail').value;
            const deliveryEmail = document.getElementById('deliveryEmail').value;
            const phone = document.getElementById('clientPhone').value;
            const remarks = document.getElementById('clientRemarks').value;
            const tipValue = parseFloat(tipInput.value) || 0;
            const finalTotal = basePrice + tipValue;

            if (!name || !email || !phone) {
                alert("Please complete required fields.");
                return;
            }

            payBtn.innerText = "LINKING TO BANKING GATEWAY...";
            payBtn.style.pointerEvents = "none";

            try {
                const response = await fetch('https://rc-delivery-engine.rebeliviouscreative.workers.dev', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        itemName: itemName,
                        price: finalTotal, 
                        clientName: name,
                        clientEmail: deliveryEmail || email,
                        clientPhone: phone,
                        clientRemarks: remarks,
                        tip: tipValue
                    })
                });

                if (response.ok) {
                    payBtn.innerText = "SUCCESS! CHECK EMAIL";
                    payBtn.style.background = "#27c93f";
                }
            } catch(e) {
                payBtn.innerText = "SYSTEM ERROR";
            }
        });
        // --- ANTI-THEFT JAVASCRIPT ---
        
        // 1. Disable Right-Click
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // 2. Disable Keyboard Shortcuts (Save, Inspect, Source)
        document.addEventListener('keydown', function(e) {
            // Block F12 (Inspect Element)
            if (e.key === 'F12') {
                e.preventDefault();
            }
            // Block Ctrl+S (Save), Ctrl+U (View Source), Ctrl+C (Copy)
            if (e.ctrlKey && (e.key === 's' || e.key === 'u' || e.key === 'c')) {
                e.preventDefault();
            }
            // Block Ctrl+Shift+I / Ctrl+Shift+J (Open Developer Tools)
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'i' || e.key === 'j')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
