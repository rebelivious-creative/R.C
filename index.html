    <style>
        /* AGENCY ARCHITECTURE - BRUTALIST LUXURY */
        :root { 
            --bg-base: #020202; 
            --accent: #E50914; /* Deep Cinematic Crimson */
            --border: #1a1a1a; 
            --text-main: #7a7a7a; 
            --text-light: #F5F5F5; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::selection { background: var(--accent); color: #fff; }
        
        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            font-family: 'Rajdhani', sans-serif; 
            overflow-x: hidden; 
            width: 100%; 
            -webkit-font-smoothing: antialiased;
        }

        /* 1. CINEMATIC NOISE GRAIN (Kills the "Flat Web" Vibe) */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        #webgl-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
        
        /* 2. STRUCTURAL LAYOUT */
        .wrapper { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; padding: 40px 20px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
        
        /* Nav: Sharp, Minimalist */
        .top-nav { 
            grid-column: span 12; display: flex; justify-content: center; gap: 40px; 
            padding: 20px 40px; background: rgba(2, 2, 2, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; 
        }
        .top-nav a { 
            color: var(--text-main); text-decoration: none; font-weight: 700; 
            letter-spacing: 3px; text-transform: uppercase; font-size: 0.85rem; 
            transition: color 0.3s; position: relative;
        }
        .top-nav a:hover, .top-nav a.active { color: var(--text-light); }
        .top-nav a::after {
            content: ''; position: absolute; bottom: -5px; left: 0; width: 0%; height: 1px;
            background: var(--accent); transition: width 0.3s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .top-nav a:hover::after { width: 100%; }

        /* Structural Cards (No more soft glass) */
        .struct-panel { 
            background: rgba(5, 5, 5, 0.6); 
            border: 1px solid var(--border); 
            padding: 60px; 
            grid-column: span 12; 
            width: 100%; 
            opacity: 0; 
            transform: translateY(20px); 
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .struct-panel.rc-visible { opacity: 1; transform: translateY(0); }
        
        .box-hero { text-align: center; padding: 120px 20px; background: transparent; border: none; }

        .specs { font-family: 'Rajdhani', sans-serif; color: var(--text-main); font-size: 0.8rem; letter-spacing: 6px; text-transform: uppercase; font-weight: 700; margin-bottom: 15px; display: block; }
        h1 { font-family: 'Oswald', sans-serif; font-size: clamp(3rem, 8vw, 7.5rem); font-weight: 700; line-height: 1; text-transform: uppercase; color: var(--text-light); letter-spacing: -2px;}
        h1 span { color: var(--text-main); }
        h2 { font-family: 'Oswald'; font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; text-transform: uppercase; margin: 0; color: var(--text-light); letter-spacing: -1px;}
        h3 { font-family: 'Oswald'; font-size: 1.5rem; font-weight: 400; color: var(--text-light); margin-bottom: 15px; letter-spacing: 1px;}
        .hero-sub { font-size: clamp(1rem, 2vw, 1.1rem); max-width: 500px; margin: 30px auto; color: var(--text-main); letter-spacing: 1px; line-height: 1.6; }
        
        /* Agency Button */
        .btn { 
            padding: 18px 40px; background: transparent; border: 1px solid var(--border); 
            color: var(--text-light); text-decoration: none; font-weight: 700; 
            font-size: 0.9rem; letter-spacing: 4px; display: inline-block; 
            transition: all 0.4s ease; text-transform: uppercase; position: relative;
            overflow: hidden;
        }
        .btn:hover { background: var(--text-light); color: var(--bg-base); border-color: var(--text-light); }

        /* Marquee */
        .client-marquee { padding: 40px 0; overflow: hidden; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); display: flex; align-items: center; width: 100%; margin: 40px 0;}
        .client-track { display: flex; width: max-content; gap: 80px; animation: rc-scroll 25s linear infinite; padding-left: 80px; align-items: center; }
        @keyframes rc-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .partner-logo { height: 45px; width: auto; max-width: 160px; object-fit: contain; filter: grayscale(100%) brightness(0.4); transition: 0.4s ease; }
        .partner-logo:hover { filter: grayscale(0%) brightness(1); }

        /* Services Grid */
        .grid-3 { grid-column: span 12; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; width: 100%; }
        .service-card { 
            background: #050505; border: 1px solid var(--border); padding: 50px 40px; 
            text-align: left; transition: 0.4s ease; display: flex; flex-direction: column; 
            position: relative;
        }
        .service-card:hover { border-color: #333; background: #080808; transform: translateY(-5px);}
        .service-icon { font-size: 2rem; color: var(--text-light); margin-bottom: 30px; opacity: 0.5; transition: 0.4s; }
        .service-card:hover .service-icon { color: var(--accent); opacity: 1; }
        .service-desc { color: #666; font-size: 0.95rem; margin-bottom: 40px; line-height: 1.7; flex-grow: 1; }
        .action-link { 
            color: var(--text-light); font-weight: 700; text-transform: uppercase; 
            letter-spacing: 2px; text-decoration: none; font-size: 0.85rem; 
            display: flex; align-items: center; gap: 10px; transition: 0.3s;
        }
        .action-link i { font-size: 0.7rem; transition: transform 0.3s; }
        .service-card:hover .action-link { color: var(--accent); }
        .service-card:hover .action-link i { transform: translateX(5px); }

        @media (max-width: 768px) { 
            .wrapper { padding: 20px 10px; } 
            .top-nav { gap: 15px; padding: 15px; } 
            .top-nav a { font-size: 0.75rem; letter-spacing: 1px; }
            .struct-panel { padding: 40px 20px; }
            .box-hero { padding: 60px 10px; }
            .grid-3 { grid-template-columns: 1fr; }
        }

        /* Sys Sec */
        img, video, canvas { -webkit-user-drag: none; -khtml-user-drag: none; -moz-user-drag: none; -o-user-drag: none; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; }
