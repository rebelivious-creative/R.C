<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Archive | R.C.</title>
    
    <link rel="canonical" href="https://rebeliviouscreative.com">
    <link rel="icon" type="image/png" href="/assets/images/logo.png?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root { 
            --bg-base: #030000; 
            --accent: #E50914; 
            --border: #1a1a1a; 
            --text-main: #888888; 
            --text-light: #F5F5F5; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::selection { background: var(--accent); color: #fff; }
        
        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Rajdhani', sans-serif; overflow-x: hidden; width: 100%; min-height: 100vh; -webkit-font-smoothing: antialiased;}

        .ambient-glow { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at 50% 0%, rgba(200, 30, 49, 0.07) 0%, transparent 70%); z-index: 0; pointer-events: none; animation: breathe 8s infinite alternate ease-in-out; }
        @keyframes breathe { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.05); } }
        .noise-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; opacity: 0.05; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }

        .wrapper { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; padding: 40px 20px; display: flex; flex-direction: column; gap: 20px; }

        .top-nav { display: flex; justify-content: center; align-items: center; gap: 40px; padding: 20px 40px; background: rgba(3, 0, 0, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; width: 100%; }
        .top-nav a { color: var(--text-main); text-decoration: none; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; font-size: 0.85rem; transition: color 0.3s; position: relative;}
        .top-nav a:hover, .top-nav a.active { color: var(--text-light); }
        .top-nav a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0%; height: 1px; background: var(--accent); transition: width 0.3s ease; }
        .top-nav a:hover::after, .top-nav a.active::after { width: 100%; }

        .struct-panel { background: rgba(5, 5, 5, 0.6); border: 1px solid var(--border); padding: 50px; display: flex; flex-direction: column; width: 100%; }
        .box-title { padding: 40px; text-align: center; }

        .specs { font-family: 'Rajdhani', sans-serif; color: var(--text-main); font-size: 0.8rem; letter-spacing: 6px; text-transform: uppercase; font-weight: 700; margin-bottom: 10px; display: block; }
        h2 { font-family: 'Oswald'; font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 700; text-transform: uppercase; margin: 0; color: var(--text-light); line-height: 1.1; }
        
        .filter-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-top: 30px; }
        .filter-btn { background: #050505; border: 1px solid var(--border); color: var(--text-main); padding: 12px 25px; font-family: 'Rajdhani'; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .filter-btn.active, .filter-btn:hover { background: var(--accent); border-color: var(--accent); color: white; }

        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; width: 100%; margin-top: 20px; }
        .portfolio-item { position: relative; border: 1px solid var(--border); height: 300px; transition: all 0.2s ease-in-out; overflow: hidden; background: #080808; }
        .portfolio-item.hide { display: none; }
        
        .portfolio-item img, .portfolio-item video { width: 100%; height: 100%; object-fit: cover; transition: 0.3s ease; filter: grayscale(100%) brightness(0.5); }
        
        /* Grounded Hover */
        .portfolio-item:hover { border-color: var(--accent); background: #080303; }
        .portfolio-item:hover img, .portfolio-item:hover video { filter: grayscale(0%) brightness(1); transform: scale(1.03); }
        
        .item-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 25px 20px; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); display: flex; flex-direction: column; pointer-events: none;}
        .item-category { color: var(--accent); font-weight: 700; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase;}
        .item-title { font-family: 'Oswald'; color: var(--text-light); font-size: 1.2rem; font-weight: 400; letter-spacing: 1px; text-transform: uppercase;}

        @media (max-width: 768px) { 
            .wrapper { padding: 20px 15px; } 
            .top-nav { padding: 15px; gap: 15px; flex-wrap: wrap;}
            .top-nav a { font-size: 0.75rem; letter-spacing: 1px; }
            .portfolio-grid { grid-template-columns: 1fr; }
            .struct-panel { padding: 30px 20px; }
        }
        
        img, video, canvas { -webkit-user-drag: none; user-select: none; }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="noise-overlay"></div>

    <div class="wrapper">
        <div class="top-nav">
            <a href="/">HOME</a>
            <a href="/gallery/" class="active">ARCHIVE</a>
            <a href="/shop/">HARDWARE</a>
        </div>

        <div class="struct-panel box-title">
            <span class="specs">THE ARCHIVE</span>
            <h2>OUR WORK</h2>
            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">Everything</button>
                <button class="filter-btn" data-filter="web">Web</button>
                <button class="filter-btn" data-filter="3d">3D</button>
                <button class="filter-btn" data-filter="brand">Brand</button>
            </div>
        </div>

        <div class="portfolio-grid struct-panel" style="padding: 10px; background: transparent; border: none;">
            
            <div class="portfolio-item" data-category="web">
                <img src="/assets/images/cf-showcase.jpg" alt="Crossfield">
                <div class="item-overlay"><span class="item-category">WEB</span><span class="item-title">CROSSFIELD SITE</span></div>
            </div>
            <div class="portfolio-item" data-category="web">
                <img src="/assets/images/cf1.png" alt="Crossfield UI">
                <div class="item-overlay"><span class="item-category">WEB</span><span class="item-title">UI CONCEPT</span></div>
            </div>
            
            <div class="portfolio-item" data-category="3d">
                <img src="/assets/images/event-lauching.png" alt="Event Render">
                <div class="item-overlay"><span class="item-category">3D</span><span class="item-title">EVENT LAUNCH</span></div>
            </div>
            <div class="portfolio-item" data-category="3d">
                <img src="/assets/images/3dcupingrender.png" alt="Royal Cuping">
                <div class="item-overlay"><span class="item-category">3D</span><span class="item-title">CUPING RENDER</span></div>
            </div>
            
            <div class="portfolio-item" data-category="3d">
                <a href="https://www.instagram.com/reel/DS8_LAjkkAD/" target="_blank" style="display:block; height:100%;">
                    <video autoplay loop muted playsinline>
                        <source src="/assets/video/Final.mp4" type="video/mp4">
                    </video>
                    <div class="item-overlay"><span class="item-category">3D</span><span class="item-title">MOTION STUDY</span></div>
                </a>
            </div>

            <div class="portfolio-item" data-category="brand">
                <img src="/assets/images/cb@300x.webp" alt="Civilian Brand"> 
                <div class="item-overlay"><span class="item-category">BRAND</span><span class="item-title">CIVILIAN CAPSULE</span></div>
            </div>
        </div>
    </div>

    <script>
        const filterBtns = document.querySelectorAll('.filter-btn');
        const portfolioItems = document.querySelectorAll('.portfolio-item');
        
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active')); 
                btn.classList.add('active');
                
                const filterValue = btn.getAttribute('data-filter');
                portfolioItems.forEach(item => { 
                    item.classList.toggle('hide', filterValue !== 'all' && item.getAttribute('data-category') !== filterValue); 
                });
            });
        });

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if(e.key === "F12" || (e.ctrlKey && ["s","u","c"].includes(e.key.toLowerCase())) || (e.ctrlKey && e.shiftKey && ["i","j"].includes(e.key.toLowerCase()))) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
